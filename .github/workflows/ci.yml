name: NimbusPact CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: nimbuspact-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python tooling
        run: python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix app

      - name: Contract lint and semantic validation
        run: npm run contract:lint

      - name: Direct contract tests
        run: npm run test

      - name: Frontend lifecycle tests
        run: npm run test:frontend

      - name: Frontend typecheck
        run: npm run frontend:typecheck

      - name: Frontend production build
        run: npm run frontend:build

      - name: Verify patch whitespace
        run: git diff --check
